<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Shop - Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/img/snowflake.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <a href="./index.html" class="logo" aria-label="Go to Home page">
            <img
              src="./assets/img/snowflake.svg"
              alt="Logo"
              class="logo__img"
            />
            <span class="logo__text">THE GIFTS</span>
          </a>

          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a href="./gifts.html" class="nav__link">GIFTS</a>
              </li>
              <li class="nav__item">
                <a href="index.html#about" class="nav__link">ABOUT</a>
              </li>
              <li class="nav__item">
                <a href="index.html#best" class="nav__link">BEST</a>
              </li>
              <li class="nav__item">
                <a href="#contacts" class="nav__link">CONTACTS</a>
              </li>
            </ul>
          </nav>

          <button class="burger" id="burger" aria-label="Open menu">
            <span class="burger__line"></span>
            <span class="burger__line"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="gifts-page">
      <div class="container">
        <div class="gifts-hero">
          <h1 class="gifts-hero__title">
            Achieve health, <br />
            harmony, and <br />
            inner strength
          </h1>

          <div class="gifts-tabs">
            <button class="tabs__btn tabs__btn--active">All</button>
            <button class="tabs__btn">For Work</button>
            <button class="tabs__btn">For Health</button>
            <button class="tabs__btn">For Harmony</button>
          </div>
        </div>

        <div class="gifts-grid" id="gifts-container"></div>
      </div>
    </main>

    <footer class="footer">
      <div class="container" id="contacts">
        <div class="footer__cards">
          <a class="footer-card" href="tel:+375291112233" aria-label="Call us">
            <img
              src="./assets/img/santa-claus.svg"
              alt="Santa"
              class="footer-card__img"
            />
            <h3 class="footer-card__title">+375 (29) 111-22-33</h3>
            <p class="footer-card__desc">CALL US</p>
          </a>

          <a
            class="footer-card"
            href="https://www.google.com/maps"
            target="_blank"
            rel="noreferrer"
            aria-label="Open location in Google Maps"
          >
            <img
              src="./assets/img/christmas-tree.svg"
              alt="Tree"
              class="footer-card__img"
            />
            <h3 class="footer-card__title">MAGIC FOREST</h3>
            <p class="footer-card__desc">MEET US</p>
          </a>

          <a
            class="footer-card"
            href="mailto:gifts@magic.com"
            aria-label="Write us an email"
          >
            <img
              src="./assets/img/snake.svg"
              alt="Snake"
              class="footer-card__img"
            />
            <h3 class="footer-card__title">GIFTS@MAGIC.COM</h3>
            <p class="footer-card__desc">WRITE US</p>
          </a>
        </div>

        <div class="footer__socials">
          <a href="#"><img src="./assets/img/telegram.svg" alt="TG" /></a>
          <a href="#"><img src="./assets/img/facebook.svg" alt="FB" /></a>
          <a href="#"><img src="./assets/img/instagram.svg" alt="Insta" /></a>
          <a href="#"><img src="./assets/img/X.svg" alt="X" /></a>
        </div>

        <div class="footer__info">
          <p>© Copyright 2025, All Rights Reserved</p>
          <a
            class="footer__made"
            href="https://rs.school/"
            target="_blank"
            rel="noreferrer"
            >Made in Rolling Scopes School</a
          >
        </div>
      </div>
    </footer>

    <!-- Modal Window -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://w3.org"
          >
            <path
              d="M18 6L6 18M6 6L18 18"
              stroke="#181C29"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <!-- Button  back to top -->
    <button id="back-to-top" class="back-to-top">
      <img src="./assets/img/image-container/arrow-up.png" alt="Up" />
    </button>

    <script src="js/script.js"></script>
  </body>
</html>
